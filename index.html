<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Devendra Agarwal — Content Strategist & Copywriter</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --accent: #D93800;
  --dark:   #111111;
  --mid:    #555555;
  --muted:  #999999;
  --border: #E8E8E8;
  --bg:     #FFFFFF;
  --surface:#F7F7F7;
}

html { scroll-behavior: smooth; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--dark); line-height: 1.6; font-size: 16px; }

/* NAV */
nav { position: sticky; top: 0; background: rgba(255,255,255,0.97); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); padding: 14px 60px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
.nav-name { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15px; color: var(--dark); }
.nav-role { font-size: 10px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }
.nav-menu { display: flex; gap: 28px; align-items: center; }
.nav-link { font-size: 13px; color: var(--mid); text-decoration: none; font-weight: 500; transition: color 0.2s; }
.nav-link:hover, .nav-link.active { color: var(--accent); }
.nav-email { font-size: 13px; color: var(--accent); text-decoration: none; font-weight: 600; border: 1px solid var(--accent); padding: 7px 14px; border-radius: 6px; transition: all 0.2s; }
.nav-email:hover { background: var(--accent); color: white; }

/* HERO */
.hero { padding: 90px 60px 60px; max-width: 1100px; margin: 0 auto; }
.hero-tag { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 20px; }
.hero-name { font-family: 'Space Grotesk', sans-serif; font-size: clamp(44px, 5.5vw, 68px); font-weight: 800; letter-spacing: -2px; line-height: 1.08; color: var(--dark); margin-bottom: 22px; }
.hero-name span { color: var(--accent); }
.hero-tagline { font-size: 17px; color: var(--mid); max-width: 500px; line-height: 1.8; margin-bottom: 36px; }
.hero-cta { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 64px; }
.cta-primary { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; padding: 12px 24px; border-radius: 6px; text-decoration: none; background: var(--accent); color: white; transition: opacity 0.2s; }
